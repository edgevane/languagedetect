[package]
name = "creator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrow-array = "60.0.0"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
hf-hub = { version = "1.0.0", features = ["blocking"] }
indicatif = "0.18.6"
edgevane_langdetect = { version = "0.1.0", path = "../library", features = ["std"] }
parquet = "60.0.0"
rayon = "1.12.0"
serde_json = "1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
