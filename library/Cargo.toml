[package]
name = "edgevane_langdetect"
version = "0.1.0"
edition = "2021"
description = "no_std language detection engine (EVLC/EVLD): char/word n-grams, TF-IDF scoring, C API"
license = "MIT"
repository = "https://github.com/edgevane/languagedetect"
homepage = "https://github.com/edgevane/languagedetect"
documentation = "https://docs.rs/edgevane_langdetect"
keywords = ["language", "detection", "nlp", "no_std", "ngram"]
categories = ["text-processing", "no-std"]
readme = "README.md"
exclude = ["target/", "**/*.evld", "**/*.evlc"]

[lib]
name = "edgevanelang"
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = []

[profile.release]
panic = "abort"

[dependencies]
dlmalloc = { version = "0.2.14", features = ["global"] }
libm = "0.2.16"
